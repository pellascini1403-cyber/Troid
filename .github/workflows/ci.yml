name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The game in a real browser (docs/PROMPT20-LOG.md): the production build, driven with real keyboard, pad and touch events in Chromium — the scenes that prove a player's whole way (a first game, the
  # pause and its map, the pad in the menus, the end of the adventure, a game that breaks, what it sends and keeps, whether it can be read; `sprites` is a lab, there to prove that what the page loads on demand
  # still starts in the bundled build). The whole suite (`npm run test:e2e`, dev and `-- --prod`) is run by hand before a release: it takes far longer than a push should wait.
  # Two jobs side by side (the runner draws with software and is ~3 times slower than a developer's machine: one after the other they went past half an hour).
  e2e:
    name: e2e (${{ matrix.group.name }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: play
            scenes: boot,movement,combat,room,world,pause,pauseMap,gamepad,focus,ending,finale,adaptive
          - name: stability
            scenes: resilience,privacy,readable,sprites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (the download of a browser and its system libraries sometimes stalls for many minutes: each attempt has its time, and there are three)
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            timeout 420 npx playwright-core install --with-deps chromium && exit 0
            echo "attempt $attempt did not finish; trying again"
          done
          exit 1
      - run: npm run build
      - run: npm run bench:bundle
      - run: npm run test:e2e -- --prod --only=${{ matrix.group.scenes }}

  # The game in the other two engines (docs/PROMPT20-LOG.md §6): Firefox and WebKit — the engine of Safari, on Linux: NOT an iPhone — start the production build, draw it, move the hero, pause, save and bring the game back,
  # and a phone-sized page takes a real tap without the hero striking. Chromium has the whole suite above. A pass is evidence about the engines, not about any device.
  engines:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: |
          for attempt in 1 2 3; do
            timeout 420 npx playwright-core install --with-deps ${{ matrix.browser }} && exit 0
            echo "attempt $attempt did not finish; trying again"
          done
          exit 1
      - run: npm run build
      - run: npm run test:engines -- --browser=${{ matrix.browser }}
