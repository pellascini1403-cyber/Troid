name: CI

on:
  push:
    branches: ['**']
  pull_request:

# the CI reads the repository and nothing else: no job needs to write to it (a token that cannot write cannot be used to)
permissions:
  contents: read

jobs:
  # typecheck, the whole unit suite and the production build. The suite takes 9–11 minutes on the runner (docs/PROMPT25-LOG.md): the limit is a stop for a hung test, not a budget for a slow one.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The cold-start budget (docs/PROMPT25-LOG.md, P1-1): everything the browser asks for before the first frame of the game, gzipped, against 204 800 B and against the reserve the bench keeps (4 KiB under that). It is a job of its
  # own, and not a first step of the e2e jobs as it was: a budget that is spent must fail ONE job that says so, not stop five jobs before their scenes run and hide what the scenes would have found.
  budget:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            timeout 420 npx playwright-core install --with-deps chromium && exit 0
            echo "attempt $attempt did not finish; trying again"
          done
          exit 1
      - run: npm run build
      - run: npm run bench:bundle

  # The game in a real browser (docs/PROMPT20-LOG.md, docs/PROMPT25-LOG.md): the production build, driven with real keyboard, pad and touch events in Chromium. EVERY scene of the suite runs here, in one of eight jobs side by side
  # (the runner draws with software and is ~3 times slower than a developer's machine, and from one run to the next it is up to twice as slow again: one after the other the scenes went past an hour, and five groups went from 15 to
  # 38 minutes): the groups are `tools/e2e/groups.ts`, balanced by the time each scene took on the runner, and a unit test fails when a scene belongs to none of them — until Prompt 25 only twenty of the sixty-nine were here, and a
  # scene run by hand is a scene that fails unseen. Each job asks for its group by name; this file keeps no list of scenes of its own, so it cannot drift.
  e2e:
    name: e2e (${{ matrix.group.name }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group:
          # the player's first way: a first game, the rooms, the pad, the light that follows the machine
          - name: play
          # the pause and its map, the loss of focus, the end of the adventure
          - name: pause
          # a game that breaks, what it sends and keeps, whether it can be read, the sprites
          - name: stability
          # the whole adventure in one page (docs/PROMPT22-LOG.md §5): ~200 000 ticks of a scripted playthrough from a new game to the way out of the world, replayed bit for bit — it takes minutes on its own (about seven minutes on the machine that wrote this, up to ten on the runner)
          - name: journey
          # touch, the phone classes, the HUD, the settings, the words, the text that fits
          - name: controls
          # the saved games, the tabs, the checkpoints, the devtools, the sound
          - name: saves
          # what is drawn: the hero and the rooms in art, the light, the effects, the cost
          - name: art
          # what is fought: the guardians, the bottles, the bolt, the hazards, the arrival at a room
          - name: fights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (the download of a browser and its system libraries sometimes stalls for many minutes: each attempt has its time, and there are three)
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            timeout 420 npx playwright-core install --with-deps chromium && exit 0
            echo "attempt $attempt did not finish; trying again"
          done
          exit 1
      - run: npm run build
      - run: npm run test:e2e -- --prod --group=${{ matrix.group.name }}
      # a scene that fails on the runner (software GL, slower than any machine that writes the game) may not fail anywhere else: the screenshot of the page as it was (`<scene>-FAILED.png`, written by `tools/e2e/run.ts`) is the evidence —
      # only those, not the forty megabytes of pictures that the scenes of a group take on purpose (`.shots` is a hidden folder, which the action leaves out unless it is told)
      - name: Keep the screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.group.name }}-shots
          path: .shots/e2e/*-FAILED.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The game in the other two engines (docs/PROMPT20-LOG.md §6): Firefox and WebKit — the engine of Safari, on Linux: NOT an iPhone — start the production build, draw it, move the hero, pause, save and bring the game back,
  # and a phone-sized page takes a real tap without the hero striking. Chromium has the whole suite above. A pass is evidence about the engines, not about any device.
  engines:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: |
          for attempt in 1 2 3; do
            timeout 420 npx playwright-core install --with-deps ${{ matrix.browser }} && exit 0
            echo "attempt $attempt did not finish; trying again"
          done
          exit 1
      - run: npm run build
      - run: npm run test:engines -- --browser=${{ matrix.browser }}
