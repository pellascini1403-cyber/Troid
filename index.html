<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Troid</title>
    <meta name="description" content="Troid: a 2D side-scrolling action-exploration metroidvania. Metroidvania 2D de acción y exploración." />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      /* UI layer: transparent to input except for its own controls. */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* The boot curtain (docs/PROMPT8-LOG.md, phase J): the page is the dark of the game from the very first paint, and stays so until the art of the first room is in
         (src/app/curtain.ts lifts it): a cold start never shows the technical blockout on its way to the produced look. */
      #boot-curtain {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #03070b;
        transition: opacity 0.8s ease;
      }
      #boot-curtain[data-state='lifting'] {
        opacity: 0;
        pointer-events: none;
      }
      #boot-curtain i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(170, 240, 255, 0.95), rgba(60, 200, 255, 0) 70%);
        animation: boot-breath 1.8s ease-in-out infinite alternate;
      }
      @keyframes boot-breath {
        from {
          opacity: 0.25;
          transform: scale(0.8);
        }
        to {
          opacity: 0.95;
          transform: scale(1.6);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-curtain i {
          animation: none;
          opacity: 0.6;
        }
      }
      /* A game that cannot begin (its code does not arrive, no drawing context, a download that never ends) says so on the curtain instead of leaving the page black: <html data-boot> says what happened — "failed" (src/app/curtain.ts, and the
         listener below when a script does not arrive) or "stalled" (the timer below, when nothing has begun after 20 s) — and the game lifts the curtain as usual if it arrives after all. Plain HTML and CSS: it needs nothing of the game. */
      #boot-curtain .boot-fail {
        display: none;
        max-width: 360px;
        padding: 0 20px;
        text-align: center;
        color: #f7faff;
      }
      html[data-boot='failed'] #boot-curtain i,
      html[data-boot='stalled'] #boot-curtain i {
        display: none;
      }
      html[data-boot='failed'] #boot-curtain .boot-fail,
      html[data-boot='stalled'] #boot-curtain .boot-fail {
        display: block;
      }
      html[data-ui='es'] .boot-fail [lang='en'],
      html:not([data-ui='es']) .boot-fail [lang='es'] {
        display: none;
      }
      .boot-msg {
        margin: 0 0 16px;
        font-size: 15px;
        line-height: 1.45;
        opacity: 0.9;
      }
      .boot-retry {
        min-height: 44px;
        padding: 0 22px;
        font: inherit;
        color: #f7faff;
        background: #0b1220;
        border: 1px solid #c1f0fc;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="boot-curtain">
      <i aria-hidden="true"></i>
      <div class="boot-fail" role="alert">
        <p class="boot-msg" lang="en">Troid could not start. Check your connection and that your browser supports WebGL, then try again.</p>
        <p class="boot-msg" lang="es">No se ha podido iniciar Troid. Comprueba la conexi&oacute;n y que tu navegador admita WebGL, y vuelve a intentarlo.</p>
        <button type="button" class="boot-retry" onclick="location.reload()"><span lang="en">Try again</span><span lang="es">Reintentar</span></button>
      </div>
    </div>
    <script>
      // The language of what the page can say before the game exists (or when it cannot begin at all).
      document.documentElement.dataset.ui = /^es/i.test(navigator.language || '') ? 'es' : 'en';
      // A script of the game that does not arrive (offline, a file gone) is said at once, not after 20 s…
      addEventListener(
        'error',
        function (e) {
          if (e.target && e.target.tagName === 'SCRIPT' && !document.documentElement.dataset.boot) document.documentElement.dataset.boot = 'failed';
        },
        true,
      );
      // …and whatever else happens to the game (a download that hangs), the player is never kept behind a curtain that says nothing: when nothing has begun after 20 s the curtain says so — and the game lifts it as usual
      // if it arrives after all.
      setTimeout(function () {
        if (document.getElementById('boot-curtain') && !document.documentElement.dataset.boot) document.documentElement.dataset.boot = 'stalled';
      }, 20000);
    </script>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
